<template id="upgrade-x"
  ><div class="border-top mt-3 pt-3">
    <div class="d-flex flex-column flex-sm-row mx-4 justify-content-center">
      <input
        inputmode="numeric"
        pattern="[0-9]*"
        type="text"
        class="form-control col-lg-3"
        :value="box.text"
        @input="box.onInput($event)"
        @keyup.enter="box.upgrade()"
      />
      <button
        type="button"
        id="upgrade-x-btn"
        class="btn btn-alt-warning mt-3 mt-sm-0 ml-sm-3 col-lg-3"
        :disabled="!box.canUpgrade"
        @click="box.upgrade()"
      >
        {{ box.label }}
      </button>
    </div>
    <small v-if="box.maxHint" class="d-block text-center text-danger mt-1"
      >{{ box.maxHint }}</small
    >
  </div></template
>
